document.querySelectorAll('.b[data-k^=s]').forEach(b=>{const f=F[sl(+b.dataset.p)],i=+b.dataset.k[1]-1;if(!f)return;b.style.opacity=(i<2?f.cd[i]>0:i==2?f.g<SK[f.ch*3+2].cost||f.cd[2]>0:f.g<100)?.4:1})}
function loop(){step();draw();requestAnimationFrame(loop)}
// 선택 화면
CH.forEach((c,i)=>{for(const p of[0,1]){const b=document.createElement('button');b.className='chip';b.innerHTML=c.e+'<br>'+c.s;b.onclick=()=>{G.c[p]=i;upd();if(R&&p==0)R.presence({c:i})};$('r'+p).appendChild(b)}});
document.querySelectorAll('#mseg button').forEach(b=>b.onclick=()=>{G.mode=+b.dataset.m;upd()});
document.querySelectorAll('#nseg button').forEach(b=>b.onclick=()=>{G.n=+b.dataset.n;upd()});
function upd(){for(const p of[0,1])[...$('r'+p).children].forEach((b,i)=>b.classList.toggle('on',i==G.c[p]));
document.querySelectorAll('#mseg button').forEach(b=>b.classList.toggle('on',+b.dataset.m==G.mode));
document.querySelectorAll('#nseg button').forEach(b=>b.classList.toggle('on',+b.dataset.n==G.n));
const on=G.mode==2;$('onl').hidden=!on;$('r1').hidden=on;$('t1').hidden=on;$('t0').textContent=on?'내 캐릭터':'1P 캐릭터';$('t1').textContent=(G.mode?'CPU':'2P')+' 캐릭터';
$('go').textContent=on?(role=='h'?'게임 시작!':'준비 완료!'):'대전 시작!';$('go').disabled=on&&!R;
$('dsc').innerHTML=(on?[0]:[0,1]).map(p=>{const c=G.c[p],C=CH[c];return '<b>'+(on?'내 캐릭터':p?(G.mode?'CPU':'2P'):'1P')+' · '+C.n+'</b><br><span class="ps">패시브 '+C.ps[0]+'</span>: '+C.ps[1]+'<br>• '+SK[c*3].n+': '+SK[c*3].d+'<br>• '+SK[c*3+1].n+': '+SK[c*3+1].d+'<br>• 궁극 '+SK[c*3+2].n+': '+SK[c*3+2].d+'<br>• 영역 '+C.dm.n}).join('<hr>')+'<hr>빈 자리는 CPU가 채워요. 4인전은 맵이 넓어져요!'}
function myPeer(){const p=PP.find(q=>q.isMe&&q.sameTab);return p&&p.peer}
async function conn(create){const o=$('ost');try{const room=window.claude&&await claude.use('room');if(!room){o.textContent='GitHub 배포판에서는 온라인 대전을 쓸 수 없어요. (Claude 공유 링크 버전에서만 지원)';return}
const code=create?Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join(''):$('code').value.trim().toLowerCase();
if(!/^[a-z0-9]{4}$/.test(code)){o.textContent='방 코드는 4글자예요.';return}
R=await room.join('jk-'+code);role=create?'h':'g';G.me=0;
R.presence({role,c:G.c[0],rdy:0});R.onPeers(ch=>{PP=ch.peers;onOpp()});
base=(create?'방 코드: '+code.toUpperCase()+' · 친구에게 알려주세요. ':'입장 완료! ')+'캐릭터를 고르세요.';o.textContent=base;upd()}catch(e){o.textContent='연결에 실패했어요. 다시 시도해 주세요.'}}
function guests(){return PP.filter(q=>!q.isMe&&q.presence.role=='g'&&q.presence.rdy).slice(0,3)}
function onOpp(){if(role=='h'){if(!started)$('ost').textContent=base+' 준비한 참가자: '+guests().length+'/3'}
else{const h=PP.find(q=>!q.isMe&&q.presence.role=='h');if(!h)return;const hp=h.presence;
if(hp.go&&!started&&hp.pl){const me=hp.pl.indexOf(myPeer());if(me<0)return;started=1;PL=hp.pl;G.me=me;G.n=hp.n;G.c=hp.cs;G.hum=PL.length;G.mode=2;startMatch()}
if(started&&hp.s)snap(hp.s)}}
function hostStart(){const gs=guests();PL=[myPeer()].concat(gs.map(q=>q.peer));G.hum=PL.length;G.n=Math.max(G.n,G.hum);G.mode=2;G.me=0;gs.forEach((q,j)=>G.c[j+1]=q.presence.c|0);lsc=[[],[],[],[]];started=1;startMatch();R.presence({go:1,pl:PL,n:G.n,cs:G.c,s:null})}
$('mk').onclick=()=>conn(1);$('jn').onclick=()=>conn(0);
$('go').onclick=()=>{if(G.mode==2){if(!R)return;if(role=='h')hostStart();else{myR=1;R.presence({c:G.c[0],rdy:1});$('ost').textContent='방장이 시작하기를 기다리는 중…'}}else startMatch()};
upd();
// 입력
const KS=[['l','◀'],['r','▶'],['u','점프'],['a','👊']].concat([['s1',''],['s2',''],['s3',''],['s4','']]);
for(const p of[0,1]){$('p'+p).querySelector('.gr').innerHTML=KS.map(k=>'<button class="b" data-p="'+p+'" data-k="'+k[0]+'">'+k[1]+'</button>').join('');$('p'+p).querySelector('small').textContent=p?'2P · ←→↑ , . / ; \'':'1P · A D W F G H J K'}
function sendIn(){const I=inp[G.me];R&&R.presence({k:(I.l?1:0)|(I.r?2:0)|(I.u?4:0)|(I.a?8:0),sc})}
function press(p,k,v){p=sl(p);const I=inp[p];if(v)bp(300,.03,'square',.015);
if(k[0]=='s'){if(v)I[k]=1}else{I[k]=v;if(k=='a'&&v)cnt[p]++}
if(G.mode==2&&G.me>0){if(v&&(k[0]=='s'||k=='a'))sc[k=='a'?4:+k[1]-1]++;sendIn()}}
document.querySelectorAll('.b').forEach(b=>{const p=+b.dataset.p,k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on2');press(p,k,1)});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>{b.classList.remove('on2');if(k[0]!='s')press(p,k,0)}))});
const M=[{KeyA:'l',KeyD:'r',KeyW:'u',KeyF:'a',KeyG:'s1',KeyH:'s2',KeyJ:'s3',KeyK:'s4'},{ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',Comma:'a',Period:'s1',Slash:'s2',Semicolon:'s3',Quote:'s4'}];
addEventListener('keydown',e=>{if(e.repeat||(e.target&&e.target.tagName=='INPUT'))return;for(const p of[0,1]){const k=M[p][e.code];if(k&&(p==0||G.mode!=1)){press(p,k,1);e.preventDefault()}}});
addEventListener('keyup',e=>{for(const p of[0,1]){const k=M[p][e.code];if(k&&k[0]!='s')press(p,k,0)}});
loop();
</script>
